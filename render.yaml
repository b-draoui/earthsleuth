services:
  - type: web
    name: earthsleuth
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: EARTHSLEUTH_FAKE
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
