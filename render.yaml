# Render Blueprint: dashboard.render.com -> New -> Blueprint -> pick this repo -> Apply.
# Every push to main redeploys once the GitHub checks pass.
services:
  - type: web
    name: earthsleuth
    runtime: docker
    plan: free # sleeps after 15 min without visits; "starter" ($7/month) never sleeps
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # redeploy on each push to main, once the GitHub tests pass
    envVars:
      - key: EARTHSLEUTH_FAKE
        value: "1" # set to "0" once data/processed/ holds the real results
      - key: LLM_API_KEY
        sync: false # Render asks for it at setup; the value never goes in the repo
